<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width" />
    <!-- Title, description, canonical and social tags are rendered per-page by
         $lib/components/Seo.svelte so that every URL gets unique metadata.
         Do not add a hardcoded <title> here: it would produce two <title>
         elements on every page. -->
    <script
      defer
      data-domain="louper.dev"
      src="https://analytics.mark3labs.com/js/script.js"
    ></script>
    %sveltekit.head%
    <!-- Google AdSense loader injected in production only (see src/hooks.server.ts) -->
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- 100% privacy friendly analytics -->
    <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript>
      <img
        src="https://queue.simpleanalyticscdn.com/noscript.gif"
        alt=""
        referrerpolicy="no-referrer-when-downgrade"
      />
    </noscript>
  </body>
</html>
